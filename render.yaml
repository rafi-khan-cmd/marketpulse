services:
  - type: web
    name: marketpulse
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: UPDATE_API_TOKEN
        sync: false
    healthCheckPath: /dashboard/

databases:
  - name: marketpulse-db
    plan: free

